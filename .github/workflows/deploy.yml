name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          ls -la
          test -f halallearn_fixed_v2.zip

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o halallearn_fixed_v2.zip -d extracted
          cp -r extracted/halallearn_fix2/. extracted/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extracted/package-lock.json

      - name: Install dependencies
        working-directory: extracted
        run: npm install

      - name: Build
        working-directory: extracted
        run: npm run build -- --base=/Earning/

      - name: Prepare publish folder
        run: |
          rm -rf publish
          mkdir -p publish/Earning
          cp -r extracted/dist/. publish/Earning/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
