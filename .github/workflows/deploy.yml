name: Build and publish site

on:
  push:
    paths:
      - 'app.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip the app
        run: |
          mkdir site
          unzip -q app.zip -d site
          DIR=$(find site -maxdepth 1 -mindepth 1 -type d | head -n 1)
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$APP_DIR"
          npm install --no-audit --no-fund
          npm run build

      - name: Publish to gh-pages
        run: |
          cd "$APP_DIR/dist"
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Build from app.zip"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
