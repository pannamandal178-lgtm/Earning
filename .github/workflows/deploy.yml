name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick newest valid ZIP
        run: |
          ls -la
          best=""
          best_time=0
          shopt -s nullglob
          for z in *.zip; do
            if unzip -tq "$z" > /dev/null 2>&1; then
              t=$(git log -1 --format=%ct -- "$z" || echo 0)
              echo "OK: $z"
              if [ "$t" -ge "$best_time" ]; then
                best="$z"
                best_time="$t"
              fi
            else
              echo "::warning::Skipping damaged ZIP: $z"
            fi
          done
          if [ -z "$best" ]; then
            echo "::error::No valid ZIP found"
            exit 1
          fi
          echo "Using: $best"
          echo "ZIP_FILE=$best" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          # যেকোনো নামের ভিতরের ফোল্ডার Auto Detect করবে
          inner=$(find extracted -maxdepth 2 -type f -name "package.json" | head -1 | xargs dirname)
          if [ -n "$inner" ] && [ "$inner" != "extracted" ]; then
            echo "Found project in: $inner"
            cp -r $inner/. extracted/
          fi
          ls -la extracted/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extracted/package-lock.json

      - name: Install dependencies
        working-directory: extracted
        run: npm install

      - name: Build
        working-directory: extracted
        run: npm run build -- --base=/Earning/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: extracted/dist
