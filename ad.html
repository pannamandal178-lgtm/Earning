<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;min-height:100%;background:#0f172a;color:#94a3b8;font-family:sans-serif}
  #st{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:13px;padding:0 16px;pointer-events:none}
</style>
</head>
<body>
<div id="st">Loading ad…</div>
<script>
  // TEMPORARY status text to find out why the ad is blank. Remove the #st lines once ads work.
  var st = document.getElementById('st');
  var s = new URLSearchParams(location.search).get('s') || '';
  if (/^https:\/\/[^\s"'<>]+$/.test(s)) {
    var el = document.createElement('script');
    el.src = s;
    el.async = true;
    el.onload = function () {
      st.textContent = 'Ad script loaded. If nothing else appears, this Adsterra unit is a Social Bar / Popunder (not a banner).';
    };
    el.onerror = function () {
      st.textContent = 'Ad script was blocked or failed to load (ad blocker, Private DNS, or network).';
    };
    document.body.appendChild(el);
  } else {
    st.textContent = 'No valid ad script URL.';
  }
</script>
</body>
</html>
